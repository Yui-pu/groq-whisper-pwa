<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Groq Whisper 超高速音声入力 - スマホから全アプリへコピー＆ペースト">
    <title>Groq Whisper Voice</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">🎤 Whisper Voice</h1>
                <span class="app-badge">Groq</span>
            </div>
            <button id="btnSettings" class="icon-btn" aria-label="設定">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- マイクエリア -->
            <div class="mic-area">
                <div class="mic-ring" id="micRing">
                    <div class="mic-pulse" id="micPulse"></div>
                    <button id="btnMic" class="mic-btn" aria-label="録音">
                        <svg id="micIcon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                        <svg id="stopIcon" class="hidden" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2"/>
                        </svg>
                    </button>
                </div>
                <p class="mic-status" id="micStatus">タップして録音</p>
                <p class="mic-timer hidden" id="micTimer">00:00</p>
            </div>

            <!-- 結果エリア -->
            <div class="result-area" id="resultArea">
                <div class="result-placeholder" id="resultPlaceholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <p>音声を録音すると<br>ここに文字起こし結果が表示されます</p>
                </div>
                <div class="result-content hidden" id="resultContent">
                    <div class="result-text" id="resultText"></div>
                    <div class="result-actions">
                        <button id="btnCopy" class="action-btn primary-action">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            コピー
                        </button>
                        <button id="btnShare" class="action-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            共有
                        </button>
                    </div>
                </div>
            </div>

            <!-- 履歴エリア -->
            <div class="history-area" id="historyArea">
                <div class="history-header">
                    <h2>履歴</h2>
                    <button id="btnClearHistory" class="text-btn">すべて削除</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">まだ履歴がありません</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 設定モーダル -->
    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>設定</h2>
                <button id="btnCloseSettings" class="icon-btn" aria-label="閉じる">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="inputApiKey">Groq API Key</label>
                    <p class="setting-desc">APIキーを入力すると端末のローカルストレージに安全に保存されます</p>
                    <div class="input-row">
                        <input type="password" id="inputApiKey" placeholder="gsk_..." autocomplete="off">
                        <button id="btnToggleKey" class="icon-btn small" aria-label="表示切替">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="setting-group">
                    <label for="selectModel">Whisper モデル</label>
                    <select id="selectModel">
                        <option value="whisper-large-v3-turbo" selected>whisper-large-v3-turbo (高速)</option>
                        <option value="whisper-large-v3">whisper-large-v3 (高精度)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="selectLang">言語</label>
                    <select id="selectLang">
                        <option value="ja" selected>日本語</option>
                        <option value="en">English</option>
                        <option value="auto">自動検出</option>
                    </select>
                </div>
                <button id="btnSaveSettings" class="save-btn">設定を保存</button>
                <button id="btnClearCache" type="button" style="margin-top: 14px; width: 100%; background: transparent; border: 1px solid rgba(255,100,100,0.3); color: #ff7675; border-radius: 8px; padding: 10px; font-size: 13px; cursor: pointer;">🔄 アプリを初期化・キャッシュ全消去</button>
                <p class="setting-note">🔒 APIキーはこの端末内にのみ保存され、Groq APIへの送信のみに使用されます</p>
            </div>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
